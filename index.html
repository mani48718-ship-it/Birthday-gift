<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Harika</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff0080,#7928ca,#2afadf);
background-size:400% 400%;
animation:bg 10s infinite;
overflow:hidden;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
padding:30px;
border-radius:25px;
text-align:center;
color:white;
width:90%;
max-width:450px;
box-shadow:0 0 30px rgba(255,255,255,0.3);
}

h1{
font-size:2.5rem;
animation:pulse 2s infinite;
}

@keyframes pulse{
50%{transform:scale(1.08);}
}

.cake{
font-size:90px;
animation:bounce 1.5s infinite;
}

@keyframes bounce{
50%{transform:translateY(-15px);}
}

p{
margin-top:15px;
font-size:1.2rem;
}

button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
font-weight:bold;
}

button:hover{
transform:scale(1.05);
}
</style>
</head>

<body>

<div class="card">
<div class="cake">🎂</div>
<h1>Happy Birthday Harika 🎉</h1>
<p>May your day be filled with happiness, love, success and unforgettable memories! ❤️</p>
<button onclick="celebrate()">Celebrate 🎊</button>
</div>

<script>
function celebrate(){

var duration=5000;
var end=Date.now()+duration;

(function frame(){

confetti({
particleCount:10,
angle:60,
spread:100,
origin:{x:0}
});

confetti({
particleCount:10,
angle:120,
spread:100,
origin:{x:1}
});

if(Date.now()<end){
requestAnimationFrame(frame);
}

})();
}

window.onload=celebrate;
</script>

</body>
</html>
